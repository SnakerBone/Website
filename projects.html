<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="./styles/style.css" />
        <title>Projects</title>
    </head>

    <body>
        <main role="main" class="container" id="main">
            <div class="row mt-5">
                <div class="col-md-6">
                    <div class="row g-0 rounded overflow-hidden flex-md-row mb-4 shadow-sm h-md-250 position-relative gradient-border">
                        <div class="col p-4 d-flex flex-column position-static">
                            <h3 class="mb-0 neue-hxt" style="color: #efefef">JSnake</h3>
                            <div class="mb-1 neue-lxt" style="color: #efefef60">Updated <span id="jsnake-timestamp"></span></div>
                            <p class="mb-auto neue-lxt" style="color: #efefefa1">A multipart Java library used in all of my Java projects. This library contains misc stuff that I have made over the years</p>
                            <div style="display: flexbox">
                                <a target="_blank" href="https://github.com/ByteSnek/JSnake" class="neue-lxt btn btn-success">GitHub</a>
                            </div>
                        </div>
                        <div class="col-auto d-none d-lg-block">
                            <div style="unicode-bidi: isolate; height: 250px"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="row g-0 rounded overflow-hidden flex-md-row mb-4 shadow-sm h-md-250 position-relative gradient-border" style="min-height: 200px">
                        <div class="col p-4 d-flex flex-column position-static">
                            <h3 class="mb-0 neue-hxt" style="color: #efefef">SnakeCrypt</h3>
                            <div class="mb-1 neue-lxt" style="color: #efefef60">Updated <span id="snakecrypt-timestamp"></span></div>
                            <p class="mb-auto neue-lxt" style="color: #efefefa1">A custom radix based codec for encrypting/decypting messages, files, images and more</p>
                            <div style="display: flexbox">
                                <a target="_blank" href="https://codec.snaker.xyz" class="neue-lxt btn btn-primary">SnakeCrypt 🛪</a>
                                <a target="_blank" href="https://github.com/ByteSnek/SnakeCrypt" class="neue-lxt btn btn-success">GitHub</a>
                            </div>
                        </div>
                        <div class="col-auto d-none d-lg-block">
                            <div style="height: 250px"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
        <script type="module" src="./scripts/projects.js"></script>
    </body>
</html>
